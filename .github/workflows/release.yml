name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  package:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node -e "const v=require('./package.json').version; const t=process.env.GITHUB_REF_NAME.slice(1); if(v!==t){console.error('tag v'+t+' does not match package version '+v); process.exit(1)}"
      - run: npm ci
      - run: npm run typecheck
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: yuncast-windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: yuncast-*
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: 小云播客坊 YunCast ${{ github.ref_name }}
          body_path: .github/release-body.md
          files: artifacts/*
